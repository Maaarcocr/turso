schema_version = 1
target = "mysql-8.4.10"
profile = "application-compatibility"

[stages]
order = ["parse", "lower", "prepare", "execute", "metadata", "wire"]

[statuses]
values = ["covered", "partial", "unsupported", "blocked", "out-of-scope"]

[[feature]]
id = "select-literals"
priority = 1
requires = []
parse = "covered"
lower = "partial"
prepare = "partial"
execute = "partial"
metadata = "partial"
wire = "blocked"
notes = "NULL, booleans, utf8mb4 strings, and signed non-negative i64 integers execute; exact decimal, unsigned, binary, bit, and temporal literals remain unsupported"

[[feature]]
id = "identifiers-and-aliases"
priority = 2
requires = ["select-literals"]
parse = "covered"
lower = "partial"
prepare = "partial"
execute = "partial"
metadata = "partial"
wire = "blocked"
notes = "Projection aliases and backtick aliases work; identifier expressions require table binding"

