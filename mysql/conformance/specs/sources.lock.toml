# Pinned upstream sources of the recorded spec corpus (mysql/conformance/SPECS.md).
#
# `mysql/conformance/fetch-sources.sh [id...]` checks each source out at exactly
# `revision` (sparse: only `paths`) into an ignored cache directory, so the
# importers and the recorder regenerate the corpus deterministically.
# Only sources with redistribute_generated_cases = true may be checked in under
# specs/<id>/; others are recorded into the ignored specs/local/.

schema_version = 1

[[source]]
id = "sqllogictest"
repository = "https://github.com/gregrahn/sqllogictest.git"
revision = "c93ac416f05635ff5cc490009add936d9753d01d"
paths = ["test", "COPYRIGHT.md"]
license = "CC0-1.0"
license_file = "COPYRIGHT.md"
redistribute_generated_cases = true
importer = "mysql/conformance/tools/import_sqllogictest.py"
notes = "SQLite sqllogictest scripts (mirror of sqlite.org/sqllogictest). COPYRIGHT.md offers GPL, BSD, MIT or CC0 at the user's choice; the corpus uses CC0-1.0. Only SQL, statement order and sort modes are used; SQLite's expected results are never copied."
