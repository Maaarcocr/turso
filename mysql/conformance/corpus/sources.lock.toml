# Pinned upstream sources. `mysql/conformance/fetch-sources.sh [id...]` checks
# each one out at exactly `revision` (sparse: only `paths`) into the ignored
# mysql/conformance/.sources/<id>. `spec_sources` lists the candidate id
# prefixes (specs/<source>/) an entry produces; the recorder commits a source's
# specs only when its entry has redistribute_generated_cases = true and writes
# all others to the ignored specs/local/. For those, `record_mysql.py
# --results-only` commits MySQL's results (no SQL) under results/<source>/ and
# `tools/materialize.py` rebuilds the specs by re-running `importers.<source>`
# (argv relative to mysql/conformance; {checkout} and {candidates} are filled
# in) on a checkout of `revision`.
schema_version = 1

[[source]]
id = "mysql-mtr-8.4.10"
repository = "https://github.com/mysql/mysql-server.git"
revision = "6adc159923b7b6abbe649949551ec25264c2daf9"
tag = "mysql-8.4.10"
# Must equal tools/import_mtr.py sparse_paths().
paths = ["mysql-test/t", "mysql-test/include", "mysql-test/suite/collations", "mysql-test/suite/engines", "mysql-test/suite/funcs_1", "mysql-test/suite/funcs_2", "mysql-test/suite/gcol", "mysql-test/suite/gis", "mysql-test/suite/innodb_fts", "mysql-test/suite/innodb_gis", "mysql-test/suite/json", "mysql-test/suite/parts"]
license = "GPL-2.0-only"
redistribute_generated_cases = false
spec_sources = ["mysql-mtr"]
importers = { "mysql-mtr" = ["tools/import_mtr.py", "--source", "{checkout}", "--output", "{candidates}"] }
notes = "tools/import_mtr.py reads the mysqltest scripts statically; MySQL's .result files are not used. GPL: only MySQL's results are committed (results/mysql-mtr/); specs are materialized locally. mine-mtr.sh (syntax miner) keeps its own checkout."

[[source]]
id = "go-mysql-server-enginetest"
repository = "https://github.com/dolthub/go-mysql-server.git"
revision = "478bed778dd282aa13aa48ebd75b0549ebe75698"
paths = ["enginetest/queries", "enginetest/scriptgen/setup/scripts", "enginetest/sqllogictest/testdata"]
license = "Apache-2.0"
redistribute_generated_cases = true
spec_sources = ["go-mysql-server"]
notes = "Syntax miner: tools/mine_go_mysql_server.py. Structured spec candidates: tools/import_gms.py (also reads enginetest/*.go drivers and enginetest/scriptgen/setup/{setup_data.sg.go,helper.go})."

[[source]]
id = "vitess-evalengine"
repository = "https://github.com/vitessio/vitess.git"
revision = "e157537374a15996987346ea6d356d1ca7e8aeec"
paths = ["go/vt/vtgate/evalengine/testcases", "go/test/endtoend/vtgate/queries", "go/test/endtoend/vtgate/vitess_tester"]
license = "Apache-2.0"
redistribute_generated_cases = true
spec_sources = ["vitess", "vitess-endtoend"]
notes = "tools/import_vitess.py ports the evalengine generator loops (the three Go files are pinned by SHA-256); tools/import_vitess_endtoend.py reads the MySQL comparison tests."

[[source]]
