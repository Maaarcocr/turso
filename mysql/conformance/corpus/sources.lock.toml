[[source]]
id = "sqllogictest"
repository = "https://github.com/gregrahn/sqllogictest.git"
revision = "c93ac416f05635ff5cc490009add936d9753d01d"
paths = ["test", "COPYRIGHT.md"]
license = "CC0-1.0"
redistribute_generated_cases = true
spec_sources = ["sqllogictest"]
notes = "tools/import_sqllogictest.py. SQLite sqllogictest scripts (mirror of sqlite.org/sqllogictest); COPYRIGHT.md offers GPL, BSD, MIT or CC0 at the user's choice and the corpus uses CC0-1.0. Only SQL, statement order and sort modes are used; SQLite's expected results are never copied."
