license = "Apache-2.0"
redistribute_generated_cases = false
spec_sources = ["tidb"]
importers = { tidb = ["tools/import_tidb.py", "--source", "{checkout}", "--output", "{candidates}"] }
notes = "tools/import_tidb.py; TiDB result files are not used. Some tests look ported from GPL MySQL MTR, so only MySQL's results are committed (results/tidb/); specs are materialized locally."

